name: Build OTK AI for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            requirements: requirements-windows.txt
            iss_file: installer.iss
            exe_name: OTK_AI_Setup.exe
            artifact_name: OTK-AI-Windows-Installer

          - variant: legacy
            requirements: requirements-windows-legacy.txt
            iss_file: installer-legacy.iss
            exe_name: OTK_AI_Setup_LegacyCPU.exe
            artifact_name: OTK-AI-Windows-Installer-LegacyCPU

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}
          pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            "OTK_AI_Windows.spec"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found"
          }

          & $iscc "${{ matrix.iss_file }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: installer/${{ matrix.exe_name }}
          if-no-files-found: error
